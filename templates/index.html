<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Medical Assistant | Premium Care</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Custom Style -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="header">
        <div class="bot-avatar">
            <i data-lucide="stethoscope"></i>
        </div>
        <div class="header-info">
            <h1>AI Medical Assistant</h1>
            <p><span class="status-dot"></span> Online & Ready to Help</p>
        </div>
        <div style="margin-left: auto;">
            <button id="clearChat" title="Clear Conversation" style="background: none; border: none; color: var(--text-secondary); cursor: pointer;">
                <i data-lucide="trash-2"></i>
            </button>
        </div>
    </header>

    <!-- Chat Area -->
    <main id="chatWindow" class="chat-body">
        <!-- Initial Bot Message -->
        <div class="message bot-message">
            Hello! I am your AI Medical Assistant. How can I help you today?
            <span class="message-time">Just now</span>
        </div>

        <!-- Starters -->
        <div id="starters" class="starters-container">
            <div class="starter-card" data-query="What are the symptoms of a common cold?">Common Cold Symptoms</div>
            <div class="starter-card" data-query="How to maintain a healthy lifestyle?">Healthy Living</div>
            <div class="starter-card" data-query="First aid for a burn?">Burn First Aid</div>
            <div class="starter-card" data-query="Tips for better sleep?">Sleep Tips</div>
        </div>
    </main>

    <!-- Input Footer -->
    <footer class="footer">
        <form id="chatForm">
            <div class="input-group">
                <input type="text" id="userInput" placeholder="Ask about health, symptoms, or medical advice..." autocomplete="off" class="type_msg" required>
                <button type="submit" class="send_btn">
                    <i data-lucide="send"></i>
                </button>
            </div>
        </form>
    </footer>
</div>

<script>
    // Initialize Lucide Icons
    lucide.createIcons();

    const chatWindow = document.getElementById('chatWindow');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const startersContainer = document.getElementById('starters');

    // Helper: Get Current Time
    function getTime() {
        const now = new Date();
        return now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0');
    }

    // Helper: Append Message
    function appendMessage(text, role) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}-message`;
        
        if (role === 'bot') {
            // Render Markdown for bot
            msgDiv.innerHTML = marked.parse(text) + `<span class="message-time">${getTime()}</span>`;
        } else {
            msgDiv.textContent = text;
            const timeSpan = document.createElement('span');
            timeSpan.className = 'message-time';
            timeSpan.textContent = getTime();
            msgDiv.appendChild(timeSpan);
        }

        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return msgDiv;
    }

    // Helper: Show Typing Indicator
    function showTyping() {
        const typingDiv = document.createElement('div');
        typingDiv.id = 'typingIndicator';
        typingDiv.className = 'message bot-message typing';
        typingDiv.innerHTML = '<span></span><span></span><span></span>';
        chatWindow.appendChild(typingDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function removeTyping() {
        const typingDiv = document.getElementById('typingIndicator');
        if (typingDiv) typingDiv.remove();
    }

    // Handle Form Submit
    chatForm.onsubmit = async (e) => {
        e.preventDefault();
        const msg = userInput.value.trim();
        if (!msg) return;

        // Hide starters after first interaction
        if (startersContainer) startersContainer.style.display = 'none';

        appendMessage(msg, 'user');
        userInput.value = '';
        
        showTyping();

        try {
            const response = await fetch('/get', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ msg: msg })
            });
            const data = await response.json();
            
            removeTyping();
            
            if (data.answer) {
                appendMessage(data.answer, 'bot');
            } else {
                appendMessage("I'm sorry, I encountered an error. Please try again.", 'bot');
            }
        } catch (err) {
            removeTyping();
            appendMessage("Connection error. Is the server running?", 'bot');
        }
    };

    // Handle Starters
    document.querySelectorAll('.starter-card').forEach(card => {
        card.onclick = () => {
            userInput.value = card.dataset.query;
            chatForm.dispatchEvent(new Event('submit'));
        };
    });

    // Clear Chat Logic (Frontend only for now)
    document.getElementById('clearChat').onclick = () => {
        if (confirm("Clear conversation history?")) {
            const botMsgs = chatWindow.querySelectorAll('.message');
            botMsgs.forEach((m, i) => { if(i > 0) m.remove(); }); // Keep first message
            if (startersContainer) startersContainer.style.display = 'flex';
        }
    };
</script>

</body>
</html>
